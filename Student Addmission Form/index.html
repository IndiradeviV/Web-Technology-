<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Admission Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Admission Form</h1>

        <!-- College Image -->
        <img src="images/Logo.png" alt="College Image">


        <!-- YouTube Video -->
        <iframe
        src="https://www.youtube.com/embed/yrLmWpyHbqs?si=cYM7dVAuB30bU6st"
        title="YouTube video player"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
</iframe>


        <!-- Admission Form -->
        <form>

            <!-- Full Name -->
            <label for="name">Full Name:</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required>


            <!-- Email -->
            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required>


            <!-- Age -->
            <label for="age">Age:</label>
            <input
                type="number"
                id="age"
                name="age"
                placeholder="Enter your age"
                min="1"
                max="100"
                required>


            <!-- Date of Birth -->
            <label for="dob">Date of Birth:</label>
            <input
                type="date"
                id="dob"
                name="dob"
                required>


            <!-- Gender -->
            <label>Gender:</label>
            <br>

            <input
                type="radio"
                id="male"
                name="gender"
                value="Male"
                required>

            <label for="male">Male</label>

            <input
                type="radio"
                id="female"
                name="gender"
                value="Female">

            <label for="female">Female</label>

            <br><br>


            <!-- Course -->
            <label for="course">Course:</label>

            <select
                id="course"
                name="course"
                required>

                <option value="">Select Course</option>
                <option value="CSE">CSE</option>
                <option value="ECE">ECE</option>
                <option value="EEE">EEE</option>
                <option value="IT">IT</option>

            </select>


            <!-- Upload Photo -->
            <label for="photo">Upload Photo:</label>

            <input
                type="file"
                id="photo"
                name="photo"
                accept="image/*"
                required>


            <!-- Address -->
            <label for="address">Address:</label>

            <textarea
                id="address"
                name="address"
                rows="4"
                placeholder="Enter your address"
                required></textarea>


            <!-- Terms and Conditions -->
            <input
                type="checkbox"
                id="terms"
                name="terms"
                value="accepted"
                required>

            <label for="terms">
                I agree to the terms and conditions
            </label>

            <br><br>


            <!-- Submit Button -->
            <button type="submit">
                Submit Application
            </button>

        </form>

    </div>

</body>

</html>
