<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Grade Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 500px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #aaa;
        }

        h1 {
            text-align: center;
            color: #234a6f;
        }

        .subtitle {
            text-align: center;
            color: #666;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #234a6f;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #176b87;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            background-color: #f1f7fa;
            border-left: 5px solid #234a6f;
            border-radius: 5px;
        }

        .pass {
            color: green;
            font-weight: bold;
        }

        .fail {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Grade Calculator</h1>

        <p class="subtitle">
            Enter marks for five subjects
        </p>

        <!-- Input Fields -->
        <label for="mark1">Subject 1:</label>
        <input type="number" id="mark1" min="0" max="100">

        <label for="mark2">Subject 2:</label>
        <input type="number" id="mark2" min="0" max="100">

        <label for="mark3">Subject 3:</label>
        <input type="number" id="mark3" min="0" max="100">

        <label for="mark4">Subject 4:</label>
        <input type="number" id="mark4" min="0" max="100">

        <label for="mark5">Subject 5:</label>
        <input type="number" id="mark5" min="0" max="100">

        <button onclick="calculateResult()">
            Calculate Result
        </button>

        <div id="result">
            Result will be displayed here.
        </div>

    </div>


    <script>

        function findGrade(average) {

            // Selection Statement
            if (average >= 90) {
                return "A+";
            }
            else if (average >= 80) {
                return "A";
            }
            else if (average >= 70) {
                return "B";
            }
            else if (average >= 60) {
                return "C";
            }
            else if (average >= 50) {
                return "D";
            }
            else {
                return "F";
            }
        }

        function calculateResult() {

            // Variables and Data Types
            let marks = [];
            let total = 0;
            let average = 0;
            let grade = "";
            let status = "";

            // ITERATION

            for (let i = 0; i < 5; i++) {

                let value = document.getElementById(
                    "mark" + (i + 1)
                ).value;

                marks[i] = Number(value);

                // Operator
                total = total + marks[i];
            }

            average = total / 5;

            grade = findGrade(average);

            let passed = true;

            for (let i = 0; i < 5; i++) {

                if (marks[i] < 35) {
                    passed = false;
                    break;
                }
            }


            if (passed == true) {
                status = "PASS";
            }
            else {
                status = "FAIL";
            }

            // DISPLAY RESULT

            let result = document.getElementById("result");

            result.innerHTML =
                "<h2>Student Result</h2>" +
                "<p><b>Total Marks:</b> " + total + " / 500</p>" +
                "<p><b>Average:</b> " + average.toFixed(2) + "</p>" +
                "<p><b>Grade:</b> " + grade + "</p>" +
                "<p><b>Status:</b> " + status + "</p>";
        }

    </script>

</body>

</html>
