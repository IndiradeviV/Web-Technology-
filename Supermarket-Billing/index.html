<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Supermarket Billing System</title>
     <link rel="stylesheet" href="style.css">
    <script> src="script.js"</script>
   
</head>

<body>

    <div class="container">

        <h1>Supermarket Bill</h1>

        <!-- Product 1 -->
        <div class="product">

            <h3>Product 1</h3>

            <label for="quantity1">Quantity:</label>
            <input
                type="number"
                id="quantity1"
                min="1"
                placeholder="Enter quantity">

            <label for="price1">Unit Price (₹):</label>
            <input
                type="number"
                id="price1"
                min="0"
                placeholder="Enter unit price">

        </div>


        <!-- Product 2 -->
        <div class="product">

            <h3>Product 2</h3>

            <label for="quantity2">Quantity:</label>
            <input
                type="number"
                id="quantity2"
                min="1"
                placeholder="Enter quantity">

            <label for="price2">Unit Price (₹):</label>
            <input
                type="number"
                id="price2"
                min="0"
                placeholder="Enter unit price">

        </div>


        <!-- Product 3 -->
        <div class="product">

            <h3>Product 3</h3>

            <label for="quantity3">Quantity:</label>
            <input
                type="number"
                id="quantity3"
                min="1"
                placeholder="Enter quantity">

            <label for="price3">Unit Price (₹):</label>
            <input
                type="number"
                id="price3"
                min="0"
                placeholder="Enter unit price">

        </div>


        <button onclick="generateBill()">
            Generate Bill
        </button>


        <!-- Bill Output -->
        <div id="bill">
            Bill details will appear here.
        </div>

    </div>


</body>

</html>
